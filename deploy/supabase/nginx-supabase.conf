# /etc/nginx/sites-available/supabase
# Reverse proxy Nginx (hôte) -> passerelle API Supabase (Envoy, 127.0.0.1:8000)
# Remplacer supabase.ciprel.ci par le sous-domaine réel (fait par setup-supabase.sh).
# Les lignes SSL sont ajoutées par Certbot.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name supabase.ciprel.ci;

    # Uploads Storage (vidéos jusqu'à 100 Mo)
    client_max_body_size 120M;

    # Realtime (WebSocket) : connexions longues
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # NB : le tableau de bord Studio est servi sur "/" par la passerelle,
    # protégé par authentification basique (DASHBOARD_USERNAME / DASHBOARD_PASSWORD
    # dans /opt/supabase/.env). Pour le réserver au réseau interne, décommenter :
    # location = / { allow 10.0.0.0/8; allow 192.168.0.0/16; deny all; proxy_pass http://127.0.0.1:8000; }
}
