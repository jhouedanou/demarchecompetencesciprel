# /etc/nginx/sites-available/ciprel-competences
# Reverse proxy Nginx -> Next.js (port 3000)
# Remplacer competences.ciprel.ci par le nom de domaine réel.
# Les lignes SSL sont ajoutées automatiquement par Certbot (voir guide, étape 8).

upstream ciprel_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name competences.ciprel.ci;

    # Taille max des uploads (vidéos / images)
    client_max_body_size 120M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Assets Next.js immuables : cache long
    location /_next/static/ {
        proxy_pass http://ciprel_next;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vidéos statiques : servies directement par Nginx (plus rapide que Node)
    location /videos/ {
        alias /var/www/ciprel-competences/public/videos/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ciprel_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # NB : les en-têtes de sécurité (Content-Security-Policy frame-ancestors,
    # X-Content-Type-Options, Referrer-Policy, Permissions-Policy) sont émis
    # par l'application elle-même (next.config.js). Ne PAS ajouter
    # "add_header X-Frame-Options" ici : cela bloquerait l'affichage dans
    # SharePoint / Teams.
}
